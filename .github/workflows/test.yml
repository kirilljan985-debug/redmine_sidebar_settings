name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redmine: ['7.0-stable', 'master']
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Clone Redmine
        run: git clone --depth 1 --branch ${{ matrix.redmine }} https://github.com/redmine/redmine.git redmine

      - name: Prepare database config and plugin directory
        run: |
          cp plugin/.github/ci/database.yml redmine/config/database.yml
          mv plugin redmine/plugins/redmine_sidebar_settings

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Bundle install
        working-directory: redmine
        run: bundle install --jobs 4

      - name: Prepare test database
        working-directory: redmine
        run: |
          bundle exec rake generate_secret_token
          bundle exec rake db:migrate RAILS_ENV=test

      - name: Run plugin tests
        working-directory: redmine
        shell: bash
        run: |
          set -o pipefail
          bundle exec rake redmine:plugins:test NAME=redmine_sidebar_settings RAILS_ENV=test 2>&1 | tee /tmp/test_output.log

      - name: Eager-load smoke check (as production)
        working-directory: redmine
        run: RAILS_ENV=test bundle exec rails runner 'Rails.application.eager_load!; puts :EAGER_OK'

      - name: Report failure details
        if: failure()
        run: |
          python3 - <<'PY' > /tmp/failure_report.txt
          import urllib.parse
          out = []
          try:
              text = open('/tmp/test_output.log','rb').read().decode('utf-8','replace')
              out.append(text[-3500:])
          except Exception as e:
              out.append(f"no test output: {e}")
          try:
              text = open('redmine/log/test.log','rb').read().decode('utf-8','replace')
              idx = text.rfind('Completed 500')
              block = text[max(0,idx-2600):idx+500] if idx != -1 else text[-3000:]
              out.append("TEST.LOG 500-CONTEXT:\n" + block)
          except Exception as e:
              out.append(f"no test.log: {e}")
          print(urllib.parse.quote("\n====\n".join(out))[:6000])
          PY
          echo "::error::$(cat /tmp/failure_report.txt)"
